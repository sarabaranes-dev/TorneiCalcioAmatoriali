<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Profilo ' + ${giocatore.nome} + ' ' + ${giocatore.cognome}">Profilo Giocatore</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <header>
        <a th:href="@{/giocatori}" class="link-indietro">&larr; Tutti i giocatori</a>
    </header>

    <section class="scheda-giocatore">
        <span class="avatar avatar-xl" th:text="${#strings.substring(giocatore.nome, 0, 1) + #strings.substring(giocatore.cognome, 0, 1)}">LR</span>
        <div class="scheda-dati">
            <h1 th:text="${giocatore.nome} + ' ' + ${giocatore.cognome}">Nome Cognome</h1>
            <span class="badge-ruolo" th:text="${giocatore.ruolo}">Attaccante</span>
            <dl class="dati-griglia">
                <div>
                    <dt>Data di nascita</dt>
                    <dd th:text="${giocatore.dataNascita != null} ? ${#temporals.format(giocatore.dataNascita, 'dd/MM/yyyy')} : 'Non specificata'">01/01/2000</dd>
                </div>
                <div>
                    <dt>Et&agrave;</dt>
                    <dd th:text="${giocatore.dataNascita != null} ? ${T(java.time.Period).between(giocatore.dataNascita, T(java.time.LocalDate).now()).years} + ' anni' : '-'">30 anni</dd>
                </div>
                <div>
                    <dt>Altezza</dt>
                    <dd th:text="${giocatore.altezza != null} ? ${giocatore.altezza} + ' cm' : 'Non specificata'">180 cm</dd>
                </div>
                <div>
                    <dt>Squadra</dt>
                    <dd>
                        <a th:if="${giocatore.squadra != null}" th:href="@{/squadre/{id}(id=${giocatore.squadra.id})}" class="squadra-link">
                            <span th:replace="~{fragments/layout :: logo(${giocatore.squadra}, 'sm')}"></span>
                            <span th:text="${giocatore.squadra.nome}">Club</span>
                        </a>
                        <span th:unless="${giocatore.squadra != null}">Svincolato</span>
                    </dd>
                </div>
            </dl>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
