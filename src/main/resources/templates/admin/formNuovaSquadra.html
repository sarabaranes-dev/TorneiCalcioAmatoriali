<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crea Nuova Squadra - Area Admin</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>

    <header class="admin-header">
        <h1>Creazione Nuova Squadra</h1>
        <p>Inserisci i dati per registrare una nuova squadra nel sistema</p>
        <div class="nav-header">
            <a th:href="@{/admin/indexAdmin}" class="btn btn-accent btn-sm">Torna alla Dashboard</a>
        </div>
    </header>

    <hr/>

    <main class="form-container">
        <form th:action="@{/admin/squadre}" method="POST" th:object="${squadra}" enctype="multipart/form-data" class="admin-form">
            
            <div th:if="${#fields.hasGlobalErrors()}" class="error-box">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore generico</p>
            </div>

            <div th:if="${erroreFile != null}" class="error-box">
                <p th:text="${erroreFile}"></p>
            </div>

            <div class="form-group">
                <label for="nome">Nome della Squadra:</label>
                <input type="text" id="nome" th:field="*{nome}" placeholder="Es: AS Roma" required />
                <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="citta">Sede:</label>
                <input type="text" id="citta" th:field="*{citta}" placeholder="Es: Roma" required />
                <span th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="annoFondazione">Anno di Fondazione:</label>
                <input type="number" id="annoFondazione" th:field="*{annoFondazione}" placeholder="Es: 1927" required />
                <span th:if="${#fields.hasErrors('annoFondazione')}" th:errors="*{annoFondazione}" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="fileLogo">Logo del Club:</label>
                <input type="file" id="fileLogo" name="fileLogo" accept="image/*" />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-accent btn-sm">Salva Squadra</button>
                <a th:href="@{/admin/indexAdmin}" class="btn btn-accent btn-sm">Annulla</a>
            </div>

        </form>
    </main>

    <footer>
        <p class="Testo-footer">SIW Tornei Calcio</p>
    </footer>

</body>
</html>
