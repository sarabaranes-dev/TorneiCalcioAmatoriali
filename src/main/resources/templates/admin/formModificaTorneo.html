<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifica Torneo - Area Admin</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>

    <header class="admin-header">
        <h1>Modifica Torneo</h1>
        <p>Aggiorna le informazioni del torneo selezionato</p>
        <div class="nav-header">
            <a th:href="@{/admin/indexAdmin}" class="btn btn-accent btn-sm">Torna alla Dashboard</a>
        </div>
    </header>

    <hr/>

    <main class="form-container">
        <form th:action="@{/admin/tornei/modifica/{id}(id=${torneo.id})}" method="POST" th:object="${torneo}" class="admin-form">
            
            <input type="hidden" th:field="*{id}" />

            <div th:if="${#fields.hasGlobalErrors()}" class="error-box">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore generico</p>
            </div>

            <div class="form-group">
                <label for="nome">Nome del Torneo:</label>
                <input type="text" id="nome" th:field="*{nome}" required />
                <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="anno">Anno:</label>
                <input type="number" id="anno" th:field="*{anno}" required />
                <span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="descrizione">Descrizione:</label>
                <textarea id="descrizione" th:field="*{descrizione}"></textarea>
                <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="error-message"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-accent btn-sm">Applica Modifiche</button>
                <a href="javascript:history.back()" class="btn btn-accent btn-sm">Indietro</a>
            </div>

        </form>
    </main>

    <footer>
        <p class="Testo-footer">SIW Tornei Calcio</p>
    </footer>

</body>
</html>
