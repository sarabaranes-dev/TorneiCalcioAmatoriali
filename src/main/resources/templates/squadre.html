<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squadre Partecipanti - TorneiCalcio</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <header>
        <h1>Squadre</h1>
        <p>Scegli un club per vedere la rosa dei giocatori e le sue partite.</p>
    </header>

    <section>
        <div th:if="${squadre == null or squadre.isEmpty()}" class="info-empty">
            Nessuna squadra registrata al momento.
        </div>
        <div class="card-grid" th:if="${squadre != null and !squadre.isEmpty()}">
            <a th:each="squadra : ${squadre}" th:href="@{/squadre/{id}(id=${squadra.id})}" class="card-link card-squadra">
                <span th:replace="~{fragments/layout :: logo(${squadra}, 'lg')}"></span>
                <h3 th:text="${squadra.nome}">Nome Squadra</h3>
                <p><span th:text="${squadra.citta}">Roma</span> &middot; fondata nel <span th:text="${squadra.annoFondazione}">2015</span></p>
            </a>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
